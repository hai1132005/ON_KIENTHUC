<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhoneStore - Thế giới công nghệ</title>
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <header>
        <div class="logo">Phone<span>Store</span></div>
        <div class="header-icons">
    <span id="user-info" style="margin-right: 15px; font-weight: 600;"></span>
    <a href="login.html" id="login-link">Đăng nhập</a>
    
    </div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Tìm kiếm điện thoại...">
            <button><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>
        <div><a href="#" id="logout-link" style="display: none;" onclick="logout()">Đăng xuất</a></div>
        <div class="header-icons">
            <a href="cart.html" class="cart-btn">
                <i class="fa-solid fa-cart-shopping"></i>
                <span id="cart-count">0</span>
            </a>
        </div>
    </header>

    <div class="container">
        <aside class="sidebar">
            <h2>Menu</h2>
            <ul>
                <li onclick="filterProduct('all')">Tất cả sản phẩm</li>
                <li onclick="filterProduct('Apple')">iPhone</li>
                <li onclick="filterProduct('Samsung')">Samsung</li>
                <li onclick="filterProduct('Oppo')">Oppo</li>
                <li onclick="filterProduct('Xiaomi')">Xiaomi</li>
            </ul>
            <div class="price-filter">
                <h3>Mức giá</h3>
                <input type="range" min="0" max="50" step="1" value="50" id="priceRange">
                <button onclick="filterByPrice()" class="btn-filter-price">Áp dụng lọc giá</button>
                <p>Dưới: <span id="priceValue">50</span> triệu</p>
            </div>
        </aside>


        <main class="content">
            <div class="content-header">
                <h2>Sản phẩm nổi bật</h2>
            </div>
            <div class="product-grid" id="productGrid"></div>
        </main>
    </div>
<div id="quickViewModal" class="modal">
    <div class="modal-content">
        <span class="close-modal" onclick="closeModal()">&times;</span>
        <div class="modal-body">
            <div class="modal-img-container">
                <img id="modalProductImg" src="" alt="">
            </div>
            <div class="modal-info-container">
                <p id="modalProductBrand" class="product-brand"></p>
                <h2 id="modalProductName"></h2>
                <p id="modalProductPrice" class="price-current"></p>
                
                <div class="product-specs">
                    <h3>Thông số kỹ thuật:</h3>
                    <ul>
                        <li>Màn hình: Siêu nét, tần số quét cao</li>
                        <li>Hệ điều hành: Mới nhất</li>
                        <li>Đặc điểm: Cấu hình mạnh mẽ, camera sắc nét</li>
                    </ul>
                </div>
                
                <div id="modalActionContainer">
                    </div>
            </div>
        </div>
    </div>
</div>
    <script>
        const range = document.getElementById("priceRange");
        const value = document.getElementById("priceValue");

        if(range && value) {
            range.addEventListener("input", function() {
                value.textContent = range.value;
                // Nếu bạn có hàm lọc theo giá, hãy gọi nó ở đây
                // filterByPrice(range.value * 1000000); 
            });
        }
    </script>
        
    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
