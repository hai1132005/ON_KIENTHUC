<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Quản Trị - PhoneStore</title>
    <link rel="stylesheet" href="css/index.css"> 
    <style>
        .admin-container { padding: 40px 5%; }
        .admin-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        
        /* Giao diện bảng quản lý */
        .admin-table { width: 100%; border-collapse: collapse; background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .admin-table th, .admin-table td { padding: 15px 20px; text-align: left; border-bottom: 1px solid #f1f2f6; }
        .admin-table th { background: #2d3436; color: white; font-weight: 600; text-transform: uppercase; font-size: 0.9rem; }
        .admin-table td img { width: 50px; height: 50px; object-fit: contain; }
        
        /* Các nút bấm hành động */
        .btn-add-product { background: linear-gradient(135deg, #2ecc71, #27ae60); color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-add-product:hover { transform: translateY(-2px); box-shadow: 0 5px 10px rgba(46,204,113,0.3); }
        .btn-action-edit { background: #f1c40f; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; margin-right: 5px; font-weight: 600; }
        .btn-action-delete { background: #e74c3c; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: 600; }
        .btn-admin-logout { background: #57606f; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: 600; }
    </style>
</head>
<body style="background-color: #f8f9fa;">

    <header>
        <div class="logo">Phone<span>Store - Hệ Thống Quản Trị</span></div>
        <div style="display: flex; align-items: center; gap: 15px;">
            <span id="adminName" style="font-weight: bold; color: #2d3436;"></span>
            <button onclick="adminLogout()" class="btn-admin-logout">Đăng xuất quản trị</button>
        </div>
    </header>

    <div class="admin-container">
        <div class="admin-header-row">
            <h2>Danh sách quản lý sản phẩm trong MySQL</h2>
            <button class="btn-add-product" onclick="openAddModal()">+ Thêm sản phẩm mới</button>
        </div>

        <table class="admin-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Hình ảnh</th>
                    <th>Tên sản phẩm</th>
                    <th>Thương hiệu</th>
                    <th>Giá tiền</th>
                    <th>Hành động</th>
                </tr>
            </thead>
            <tbody id="adminProductTable">
                </tbody>
        </table>
    </div>

    <form id="addProductForm">
    <div style="margin-bottom: 15px;">
        <label style="display:block; margin-bottom:5px; font-weight:600;">Tên sản phẩm *</label>
        <input type="text" id="addName" required style="width:100%; padding:10px; border:1px solid #ddd; border-radius:6px;">
    </div>
    <div style="margin-bottom: 15px;">
        <label style="display:block; margin-bottom:5px; font-weight:600;">Giá tiền (VNĐ) *</label>
        <input type="number" id="addPrice" required style="width:100%; padding:10px; border:1px solid #ddd; border-radius:6px;">
    </div>
    <div style="margin-bottom: 15px;">
        <label style="display:block; margin-bottom:5px; font-weight:600;">Thương hiệu *</label>
        <input type="text" id="addBrand" required style="width:100%; padding:10px; border:1px solid #ddd; border-radius:6px;" placeholder="Apple, Samsung, Xiaomi...">
    </div>
    <div style="margin-bottom: 15px;">
        <label style="display:block; margin-bottom:5px; font-weight:600;">Link hình ảnh URL *</label>
        <input type="url" id="addImg" required style="width:100%; padding:10px; border:1px solid #ddd; border-radius:6px;">
    </div>
    
    <h4 style="margin: 20px 0 10px 0; color: #57606f;">Thông số cấu hình chi tiết:</h4>
    <div style="background: #f1f2f6; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
        <input type="text" id="specScreen" placeholder="Màn hình (Ví dụ: 6.7 inch, OLED)" style="width:100%; padding:8px; margin-bottom:8px; border:1px solid #ddd; border-radius:4px;" required>
        <input type="text" id="specChip" placeholder="Chipset (Ví dụ: Apple A17 Pro)" style="width:100%; padding:8px; margin-bottom:8px; border:1px solid #ddd; border-radius:4px;" required>
        <input type="text" id="specRam" placeholder="RAM (Ví dụ: 8 GB)" style="width:100%; padding:8px; margin-bottom:8px; border:1px solid #ddd; border-radius:4px;" required>
        <input type="text" id="specStorage" placeholder="Bộ nhớ trong (Ví dụ: 256 GB)" style="width:100%; padding:8px; border:1px solid #ddd; border-radius:4px;" required>
    </div>

    <button type="submit" style="width: 100%; padding: 12px; background: linear-gradient(135deg, #2ecc71, #27ae60); color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1rem;">Lưu vào MySQL Database</button>
</form>

    <script src="js/admin.js"></script>
</body>
</html>
