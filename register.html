<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký - PhoneStore</title>
    <link rel="stylesheet" href="css/index.css"> 
    <style>
        .auth-container { max-width: 400px; margin: 80px auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .auth-form h2 { text-align: center; margin-bottom: 25px; color: #2d3436; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #dfe4ea; border-radius: 8px; outline: none; }
        .btn-auth { width: 100%; padding: 12px; background: #e74c3c; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn-auth:hover { background: #c0392b; }
        .auth-link { text-align: center; margin-top: 15px; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="auth-container">
        <form class="auth-form" id="registerForm">
            <h2>Đăng ký tài khoản</h2>
            <div class="form-group">
                <label>Tên đăng nhập</label>
                <input type="text" id="regUsername" required>
            </div>
            <div class="form-group">
                <label>Mật khẩu</label>
                <input type="password" id="regPassword" required>
            </div>
            <div class="form-group">
                <label>Xác nhận mật khẩu</label>
                <input type="password" id="regConfirmPassword" required>
            </div>
            <button type="submit" class="btn-auth">Đăng ký</button>
            <div class="auth-link">Đã có tài khoản? <a href="login.html">Đăng nhập ngay</a></div>
        </form>
    </div>
    <script src="js/auth.js"></script>
</body>
</html>
